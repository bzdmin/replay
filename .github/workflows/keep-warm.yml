name: Keep the demo warm

# Free hosting sleeps when idle, and a judge should not land on a cold start.
# This pings the health endpoint every ten minutes. It hits /healthz, which
# does no work and costs nothing, rather than the page or a rehearsal.
#
# Set the repository variable DEMO_URL to the deployed base URL
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        env:
          DEMO_URL: ${{ vars.DEMO_URL }}
        run: |
          if [ -z "$DEMO_URL" ]; then
            echo "DEMO_URL is not set; nothing to ping."
            exit 0
          fi
          code=$(curl -fsS -o /dev/null -w "%{http_code}" --max-time 60 "$DEMO_URL/healthz" || echo "000")
          echo "$DEMO_URL/healthz -> $code"
          if [ "$code" != "200" ]; then
            echo "Demo did not return 200. It may be waking up, or it may be down."
            exit 1
          fi
