<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1450" viewBox="0 0 1600 1450" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker>
<marker id="arA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d97706"/></marker>
</defs>
<rect width="1600" height="1450" fill="#ffffff"/>

<text x="60" y="60" font-size="36" font-weight="700" fill="#0f172a">Replay</text>
<text x="60" y="92" font-size="18" fill="#475569">Rehearse a change before you ship it. System architecture.</text>
<text x="1540" y="56" font-size="13" fill="#64748b" text-anchor="end">Agents for Humans Hackathon &#183; Professional Agents track</text>
<text x="1540" y="78" font-size="13" fill="#64748b" text-anchor="end">Built with the Strands Agents SDK on AWS</text>
<line x1="60" y1="112" x2="1540" y2="112" stroke="#e2e8f0" stroke-width="2"/>

<rect x="620" y="140" width="360" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="167" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.2">ENGINEER</text>
<text x="800" y="189" font-size="15" fill="#0f172a" text-anchor="middle">Proposed change, in plain language</text>
<line x1="800" y1="204" x2="800" y2="232" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="560" y="236" width="480" height="64" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="800" y="263" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.2">REPLAY WEB UI</text>
<text x="800" y="285" font-size="15" fill="#0f172a" text-anchor="middle">Single page &#183; live rehearsal progress &#183; evidence view</text>
<line x1="800" y1="300" x2="800" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="140" y="308" width="1320" height="412" rx="12" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="9 7"/>
<text x="160" y="330" font-size="13" font-weight="700" fill="#64748b" letter-spacing="0.8">REPLAY AGENT RUNTIME</text>

<rect x="440" y="348" width="720" height="76" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
<text x="800" y="378" font-size="13" font-weight="700" fill="#4f46e5" text-anchor="middle" letter-spacing="1.2">STRANDS ORCHESTRATOR</text>
<text x="800" y="402" font-size="15" fill="#1e1b4b" text-anchor="middle">Coordinates specialised agents &#183; holds shared rehearsal state</text>

<rect x="1200" y="352" width="240" height="68" rx="8" fill="#fff7ed" stroke="#ff9900" stroke-width="2"/>
<text x="1320" y="379" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="1">AMAZON BEDROCK</text>
<text x="1320" y="400" font-size="14" fill="#7c2d12" text-anchor="middle">Model inference</text>
<line x1="1160" y1="386" x2="1196" y2="386" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<line x1="800" y1="424" x2="800" y2="440" stroke="#94a3b8" stroke-width="2"/>
<path d="M380,440 H1220" stroke="#94a3b8" stroke-width="2" fill="none"/>
<line x1="380" y1="440" x2="380" y2="472" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="800" y1="440" x2="800" y2="472" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1220" y1="440" x2="1220" y2="472" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="190" y="476" width="380" height="104" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="380" y="506" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle" letter-spacing="1.1">IMPACT AGENT</text>
<text x="380" y="532" font-size="14" fill="#334155" text-anchor="middle">Traces dependencies and finds every</text>
<text x="380" y="552" font-size="14" fill="#334155" text-anchor="middle">component the change can reach,</text>
<text x="380" y="572" font-size="14" fill="#334155" text-anchor="middle">including paths the diff never touches</text>

<rect x="610" y="476" width="380" height="104" rx="8" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
<text x="800" y="506" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle" letter-spacing="1.1">SCENARIO AGENT</text>
<text x="800" y="532" font-size="14" fill="#334155" text-anchor="middle">Derives representative behavioural</text>
<text x="800" y="552" font-size="14" fill="#334155" text-anchor="middle">scenarios from the proposed change</text>
<text x="800" y="572" font-size="14" fill="#334155" text-anchor="middle">and the business rules it finds</text>

<rect x="1030" y="476" width="380" height="104" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2"/>
<text x="1220" y="506" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1.1">REPLAY RUNNER &#183; NOT AN AGENT</text>
<text x="1220" y="532" font-size="14" fill="#334155" text-anchor="middle">Executes every scenario against both</text>
<text x="1220" y="552" font-size="14" fill="#334155" text-anchor="middle">versions and captures real observed</text>
<text x="1220" y="572" font-size="14" fill="#334155" text-anchor="middle">output. Deterministic, by design.</text>

<line x1="380" y1="580" x2="380" y2="620" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="800" y1="580" x2="800" y2="620" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1220" y1="580" x2="1220" y2="620" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="190" y="624" width="1220" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="215" y="648" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.1">TOOL LAYER &#183; STRANDS TOOLS</text>
<g font-family="Cascadia Mono,Consolas,monospace" font-size="13" fill="#334155">
<rect x="435" y="662" width="150" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/><text x="510" y="682" text-anchor="middle">search_repository</text>
<rect x="601" y="662" width="95" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/><text x="648" y="682" text-anchor="middle">read_file</text>
<rect x="712" y="662" width="140" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/><text x="782" y="682" text-anchor="middle">list_repository</text>
<rect x="868" y="662" width="115" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/><text x="925" y="682" text-anchor="middle">search_tests</text>
<rect x="999" y="662" width="165" height="30" rx="6" fill="#eef2ff" stroke="#c7d2fe"/><text x="1081" y="682" text-anchor="middle">read_documentation</text>
</g>

<line x1="470" y1="706" x2="470" y2="762" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<line x1="1130" y1="706" x2="1130" y2="762" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="190" y="766" width="560" height="150" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="470" y="794" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.1">TARGET REPOSITORY</text>
<text x="470" y="818" font-size="15" fill="#0f172a" text-anchor="middle">AcmePay, a realistic demo application</text>
<g font-family="Cascadia Mono,Consolas,monospace" font-size="12.5" fill="#475569">
<text x="470" y="847" text-anchor="middle">payment-service &#183; refund-service &#183; billing-service</text>
<text x="470" y="869" text-anchor="middle">legacy-billing &#183; auth-service &#183; notification-service</text>
<text x="470" y="891" text-anchor="middle">tests/ &#183; docs/ &#183; config/</text>
</g>

<rect x="850" y="766" width="560" height="150" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="2.5"/>
<text x="1130" y="794" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1.1">REPLAY SANDBOX</text>
<text x="1130" y="817" font-size="14" fill="#134e4a" text-anchor="middle">Isolated copy of the repository, change applied, scenarios executed</text>
<rect x="872" y="832" width="252" height="62" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="998" y="856" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1">BEFORE</text>
<text x="998" y="878" font-size="13" fill="#334155" text-anchor="middle">current behaviour</text>
<rect x="1136" y="832" width="252" height="62" rx="6" fill="#ffffff" stroke="#0d9488" stroke-width="1.5"/>
<text x="1262" y="856" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1">AFTER</text>
<text x="1262" y="878" font-size="13" fill="#334155" text-anchor="middle">proposed behaviour</text>

<line x1="750" y1="841" x2="846" y2="841" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>
<text x="798" y="833" font-size="11.5" fill="#64748b" text-anchor="middle">copy + patch</text>

<line x1="1130" y1="916" x2="1130" y2="946" stroke="#94a3b8" stroke-width="2"/>
<path d="M1130,946 H800 V976" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<rect x="540" y="980" width="520" height="70" rx="8" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>
<text x="800" y="1008" font-size="12" font-weight="700" fill="#0f766e" text-anchor="middle" letter-spacing="1.1">BEHAVIOURAL DIFF</text>
<text x="800" y="1032" font-size="15" fill="#0f172a" text-anchor="middle">Before vs after, per scenario. Real observed output.</text>
<line x1="800" y1="1050" x2="800" y2="1082" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="420" y="1086" width="760" height="104" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2.5"/>
<text x="800" y="1116" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle" letter-spacing="1.2">VERIFIER AGENT &#183; ADVERSARIAL</text>
<text x="800" y="1142" font-size="15" fill="#78350f" text-anchor="middle">Given one job: prove the conclusion wrong.</text>
<text x="800" y="1166" font-size="14" fill="#92400e" text-anchor="middle">Searches for counterexamples, unmodified code paths and conflicting business rules.</text>

<path d="M420,1138 H150 V665 H186" stroke="#d97706" stroke-width="2" fill="none" stroke-dasharray="7 6" marker-end="url(#arA)"/>
<text x="163" y="905" font-size="12" font-weight="600" fill="#b45309" transform="rotate(-90 163 905)" text-anchor="middle">re-queries evidence to challenge the result</text>

<line x1="800" y1="1190" x2="800" y2="1218" stroke="#94a3b8" stroke-width="2"/>
<path d="M800,1218 H520 V1250" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>
<path d="M800,1218 H1080 V1250" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#ar)"/>

<rect x="260" y="1254" width="520" height="88" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
<text x="520" y="1282" font-size="12" font-weight="700" fill="#b91c1c" text-anchor="middle" letter-spacing="1.1">RISK REPORT</text>
<text x="520" y="1306" font-size="14.5" fill="#7f1d1d" text-anchor="middle">Divergences classified by severity, with</text>
<text x="520" y="1328" font-size="14.5" fill="#7f1d1d" text-anchor="middle">evidence attached to every single claim</text>

<rect x="820" y="1254" width="520" height="88" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
<text x="1080" y="1282" font-size="12" font-weight="700" fill="#64748b" text-anchor="middle" letter-spacing="1.1">EVIDENCE</text>
<text x="1080" y="1306" font-size="14.5" fill="#334155" text-anchor="middle">Every claim carries file:line references</text>
<text x="1080" y="1328" font-size="14.5" fill="#334155" text-anchor="middle">and the rule it contradicts</text>

<path d="M520,1342 V1368 H800" stroke="#94a3b8" stroke-width="2" fill="none"/>
<path d="M1080,1342 V1368 H800" stroke="#94a3b8" stroke-width="2" fill="none"/>
<line x1="800" y1="1368" x2="800" y2="1386" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar)"/>

<rect x="500" y="1390" width="600" height="46" rx="8" fill="#0f172a"/>
<text x="800" y="1419" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle">HUMAN APPROVAL. Replay never ships a change on its own.</text>
</svg>